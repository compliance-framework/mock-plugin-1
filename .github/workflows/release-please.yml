# Opens/updates the release PR and, once it merges, tags and publishes the release (W1-S1).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@7b55019ed36050a57eb8273f6a67fd4b2395adb0 # v1.5.1
    permissions:
      contents: read
    secrets: inherit
