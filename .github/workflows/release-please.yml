# Opens/updates the release PR and, once it merges, tags and publishes the release (W1-S1).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@ec58cea2c02f12b5dad6b23a7bfdc84360f59f11 # v1.3.0
    permissions:
      contents: read
    secrets: inherit
