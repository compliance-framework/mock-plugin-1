# Opens/updates the release PR and, once it merges, tags and publishes the release (W1-S1).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@21aaac7c174aaf90abafecf1c90c30b238367d3d # v1.3.1
    permissions:
      contents: read
    secrets: inherit
