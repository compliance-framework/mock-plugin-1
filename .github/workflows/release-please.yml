# Opens/updates the release PR and, once it merges, tags and publishes the release (W1-S1).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@d72b127a668e93d3eb503f775fb4c2bbb0bfdef9 # v1.2.0
    permissions:
      contents: read
    secrets: inherit
