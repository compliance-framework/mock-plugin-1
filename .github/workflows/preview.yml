# Publishes :pr-<number> previews for PRs labelled `preview` (no :main previews for plugins) (W1-S1).
name: preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    uses: compliance-framework/workflows/.github/workflows/preview.yml@d72b127a668e93d3eb503f775fb4c2bbb0bfdef9 # v1.2.0
    with:
      kind: go-plugin
      on-main: false
    permissions:
      contents: read
      packages: write
