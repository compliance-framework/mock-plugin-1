# Publishes the plugin (goreleaser archives + gooci upload) when a release is published (W1-S1).
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-plugin.yml@5a81b1ac6081babf702713afb497d5a4f5c662bf # v1.0.0
    with:
      protocol-version: "2"
    permissions:
      contents: write # goreleaser attaches the archives to the release
      packages: write
    secrets: inherit
