# Publishes the plugin (goreleaser archives + gooci upload) when a release is published (W1-S1).
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-plugin.yml@21aaac7c174aaf90abafecf1c90c30b238367d3d # v1.3.1
    with:
      protocol-version: "2"
    permissions:
      contents: write # goreleaser attaches the archives to the release
      packages: write
    secrets: inherit
