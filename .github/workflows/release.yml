# Publishes the plugin (goreleaser archives + gooci upload) when a release is published (W1-S1).
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-plugin.yml@ca987fae431ad10a65315b87ae87a5a579f817a9 # v1.3.2
    with:
      protocol-version: "2"
    permissions:
      contents: write # goreleaser attaches the archives to the release
      packages: write
    secrets: inherit
