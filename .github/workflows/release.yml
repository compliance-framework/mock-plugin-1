# Publishes the plugin (goreleaser archives + gooci upload) when a release is published (W1-S1).
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-plugin.yml@899dbe5d7dac02de5fd60a92d764b189259e03dd # v1.5.0
    with:
      protocol-version: "2"
    permissions:
      contents: write # goreleaser attaches the archives to the release
      packages: write
    secrets: inherit
