# Publishes the plugin (goreleaser archives + gooci upload) when a release is published (W1-S1).
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-plugin.yml@ec58cea2c02f12b5dad6b23a7bfdc84360f59f11 # v1.3.0
    with:
      protocol-version: "2"
    permissions:
      contents: write # goreleaser attaches the archives to the release
      packages: write
    secrets: inherit
